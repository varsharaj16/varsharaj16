<svg width="1200" height="400" viewBox="0 0 1200 400"
xmlns="http://www.w3.org/2000/svg">

<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#0c0c12"/>
    <stop offset="55%" stop-color="#17121c"/>
    <stop offset="100%" stop-color="#0a0a0f"/>
  </linearGradient>

  <linearGradient id="name" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0%" stop-color="#ffd8e8"/>
    <stop offset="50%" stop-color="#f2a8ca"/>
    <stop offset="100%" stop-color="#cbbcff"/>
  </linearGradient>

  <radialGradient id="pinkGlow">
    <stop offset="0%" stop-color="#f3a6c8" stop-opacity=".3"/>
    <stop offset="100%" stop-color="#f3a6c8" stop-opacity="0"/>
  </radialGradient>
</defs>

<!-- Background -->
<rect width="1200" height="400" rx="18" fill="url(#bg)"/>

<!-- Soft glow -->
<circle cx="1030" cy="100" r="280" fill="url(#pinkGlow)"/>

<!-- Stars -->
<g fill="#ffddea" opacity=".75">
  <circle cx="90" cy="70" r="2"/>
  <circle cx="180" cy="125" r="1.5"/>
  <circle cx="290" cy="55" r="2"/>
  <circle cx="900" cy="65" r="2"/>
  <circle cx="1080" cy="145" r="1.5"/>
  <circle cx="1140" cy="75" r="2"/>
</g>

<!-- Flowers -->
<g transform="translate(950 105)">
  <circle cx="0" cy="-20" r="13" fill="#f3a6c8"/>
  <circle cx="20" cy="0" r="13" fill="#cdbdff"/>
  <circle cx="0" cy="20" r="13" fill="#f3a6c8"/>
  <circle cx="-20" cy="0" r="13" fill="#cdbdff"/>
  <circle cx="0" cy="0" r="7" fill="#ffe4a8"/>
</g>

<!-- Small bow -->
<g transform="translate(850 285)">
  <path d="M0 0 C-45 -35 -70 5 -20 18
           C-45 45 -5 55 15 15
           C35 55 75 45 45 18
           C95 5 65 -35 20 0 Z"
        fill="#f0a5c7"/>
  <circle cx="10" cy="10" r="10" fill="#ffd7e8"/>
</g>

<!-- Intro -->
<text x="70" y="72"
      fill="#c9aebe"
      font-family="Arial, sans-serif"
      font-size="13"
      letter-spacing="5">
  HELLO, I'M
</text>

<!-- Name -->
<text x="68" y="155"
      fill="url(#name)"
      font-family="Arial, sans-serif"
      font-size="62"
      font-weight="700"
      letter-spacing="3">
  VARSHA RAJ
</text>

<!-- Divider -->
<rect x="70" y="178"
      width="280"
      height="2"
      rx="1"
      fill="#efa6c7"/>

<!-- Role -->
<text x="70" y="225"
      fill="#f5edf2"
      font-family="Arial, sans-serif"
      font-size="23"
      font-weight="600">
  Computer Science Engineer
</text>

<!-- Skills -->
<text x="70" y="260"
      fill="#d2c2d1"
      font-family="Arial, sans-serif"
      font-size="15"
      letter-spacing="2">
  AI • FULL STACK
</text>

<!-- Dino -->
<g transform="translate(1030 245)">

  <!-- tail -->
  <path d="M-65 20 C-120 55 -150 10 -120 -5"
        fill="none"
        stroke="#9c82b9"
        stroke-width="13"
        stroke-linecap="round"/>

  <!-- body -->
  <ellipse cx="0" cy="0"
           rx="58" ry="45"
           fill="#b99bcf"/>

  <!-- neck -->
  <path d="M-20 -20 C-35 -75 5 -100 40 -70"
        fill="none"
        stroke="#b99bcf"
        stroke-width="35"
        stroke-linecap="round"/>

  <!-- head -->
  <ellipse cx="45" cy="-75"
           rx="45" ry="32"
           fill="#c7addb"/>

  <!-- spikes -->
  <path d="M10 -105 L20 -130 L32 -105
           L45 -135 L55 -102
           L70 -125 L75 -92"
        fill="#f0a5c7"/>

  <!-- eye -->
  <circle cx="62" cy="-82" r="5" fill="#17121c"/>

  <!-- smile -->
  <path d="M68 -68 Q80 -60 88 -70"
        fill="none"
        stroke="#17121c"
        stroke-width="3"
        stroke-linecap="round"/>

  <!-- legs -->
  <rect x="-35" y="28"
        width="18" height="40"
        rx="9"
        fill="#a98abd"/>

  <rect x="20" y="28"
        width="18" height="40"
        rx="9"
        fill="#a98abd"/>

  <!-- feet -->
  <ellipse cx="-27" cy="70"
           rx="22" ry="8"
           fill="#8e72a7"/>

  <ellipse cx="29" cy="70"
           rx="22" ry="8"
           fill="#8e72a7"/>

</g>

<!-- Bottom signature -->
<text x="70" y="345"
      fill="#9f8e9e"
      font-family="Arial, sans-serif"
      font-size="11"
      letter-spacing="3">
  BUILD • LEARN • CREATE
</text>

</svg>